name: gongkao-job-monitor

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install chromium || true

      - name: Run monitor
        env:
          SERVER_CHAN_KEY: ${{ secrets.SERVER_CHAN_KEY }}
          SERVER_CHAN_KEY_2: ${{ secrets.SERVER_CHAN_KEY_2 }}
          PAGES_URL: ${{ vars.PAGES_URL }}
          FETCH_PROXY: ${{ vars.FETCH_PROXY }}
          READER_PROXY: ${{ vars.READER_PROXY }}
        run: python main.py

      - name: Commit history back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "chore: update history.json [skip ci]"
          git push

      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        with:
          name: history-page
          path: site/history.html
          if-no-files-found: warn

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
